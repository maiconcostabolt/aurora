    <script>
        window.__AURORA_ANDROID__ =
            window.location.protocol === "file:" ||
            new URLSearchParams(window.location.search).get("source") === "android";

        if (window.__AURORA_ANDROID__) {
            window.AURORA_PDF_STANDALONE_PIPELINE = true;

            window.print = function () {
                if (window.AuroraAndroid) {
                    window.AuroraAndroid.printPage();
                }
            };
        }
    </script>

    <script>
        (function () {
            try {
                var params = new URLSearchParams(window.location.search);
                var token = params.get("invite");
                if (!token) return;
                token = String(token).trim();
                if (token.length < 16 || token.length > 128 || !/^[A-Za-z0-9_-]+$/.test(token)) return;
                sessionStorage.setItem("aurora_pending_company_invite_v1", token);
                sessionStorage.removeItem("aurora_pending_company_invite_terminal_v1");
                sessionStorage.removeItem("aurora_invite_auth_completed_v1");
                params.delete("invite");
                var qs = params.toString();
                var nextUrl = window.location.pathname + (qs ? "?" + qs : "") + (window.location.hash || "");
                history.replaceState(null, "", nextUrl);
            } catch (e) {
                /* fail closed — não persistir token inválido */
            }
        })();
    </script>
