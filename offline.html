<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Aurora — Offline</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;
font-family:Inter,Arial,sans-serif;color:#edf5ff;background:
radial-gradient(circle at 25% 15%,rgba(100,240,229,.15),transparent 30%),
radial-gradient(circle at 80% 30%,rgba(140,98,255,.15),transparent 35%),#07111f}
main{width:min(440px,100%);padding:28px;border:1px solid #2b3d57;border-radius:24px;
background:#101c2d;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.logo{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;
border-radius:22px;color:#062421;background:#64f0e5;font-size:30px;font-weight:900}
h1{margin:0 0 10px}p{color:#9cb0c9;line-height:1.55}
button{min-height:48px;width:100%;border:0;border-radius:13px;color:#062421;
background:#64f0e5;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<main>
<div class="logo">A</div>
<h1>Aurora está offline</h1>
<p>Os recursos já carregados continuam disponíveis. Reconecte-se e tente novamente.</p>
<button onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
